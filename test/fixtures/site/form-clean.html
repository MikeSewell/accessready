<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forms that handle mistakes well</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main, footer { padding: 24px; }
  a { color: #0b4a8f; }
  label { display: block; margin-top: 12px; }
  input, button, textarea, select { font: inherit; padding: 8px 12px; margin: 4px 0; border: 1px solid #555; }
  .error { color: #a00; }
</style>
</head>
<body>
<main>
  <h1>Contact us</h1>
  <form id="contact" action="/submit" method="post" novalidate aria-label="Contact">
    <p>Fields marked (required) must be filled in.</p>
    <label for="name">Name (required)</label>
    <input id="name" name="name" type="text" autocomplete="name" required aria-describedby="name-error">
    <span id="name-error" class="error"></span>
    <label for="email">Email (required)</label>
    <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
    <span id="email-error" class="error"></span>
    <button type="submit">Send</button>
  </form>
  <h2>Volunteers</h2>
  <form action="/submit" method="post" aria-label="Log in">
    <label for="user">Username (required)</label>
    <input id="user" name="user" type="text" autocomplete="username" required>
    <label for="pw">Password (required)</label>
    <input id="pw" name="pw" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
  </form>
  <h2>Gift boxes</h2>
  <form action="/submit-get" aria-label="Gift box">
    <fieldset>
      <legend>Billing address</legend>
      <label for="b-street">Street</label>
      <input id="b-street" name="b-street" type="text" autocomplete="billing street-address">
    </fieldset>
    <label><input id="same" name="same" type="checkbox" checked> Shipping address is the same as billing</label>
    <fieldset>
      <legend>Shipping address</legend>
      <label for="s-street">Street</label>
      <input id="s-street" name="s-street" type="text" autocomplete="shipping street-address">
    </fieldset>
    <button type="submit">Continue to review</button>
  </form>
  <form role="search" action="/submit-get">
    <label for="q">Search</label>
    <input id="q" name="q" type="search">
    <button type="submit">Search</button>
  </form>
</main>
<script>  // Each error is written next to its field, linked to it, the field is marked invalid, and
  // focus moves to the first one.
  document.getElementById('contact').addEventListener('submit', (e) => {
    const checks = [
      ['name', (v) => v.trim() !== '', 'Enter your name'],
      ['email', (v) => /^[^@\s]+@[^@\s]+$/.test(v), 'Enter an email address in the format name@example.com'],
    ];
    let first = null;
    for (const [id, ok, message] of checks) {
      const field = document.getElementById(id), error = document.getElementById(id + '-error');
      const good = ok(field.value);
      error.textContent = good ? '' : message;
      field.setAttribute('aria-invalid', String(!good));
      if (!good && !first) first = field;
    }
    if (first) { e.preventDefault(); first.focus(); }
  });</script>
</body>
</html>
