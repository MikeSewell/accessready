<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Date picker with a read-only box</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main, footer, header { padding: 24px; }
  a { color: #0b4a8f; }
  label { display: block; margin-top: 12px; }
  input, button, textarea, select { font: inherit; padding: 8px 12px; margin: 4px 0; border: 1px solid #555; }
  fieldset label { display: inline-block; margin-right: 16px; }
  .error { color: #a00; }
</style>
</head>
<body>
<main>
  <h1>Book a delivery</h1>
  <p>We deliver food boxes to people who cannot travel.</p>
  <form action="/submit-get">
    <label for="day">Day of the delivery</label>
    <input id="day" name="day" type="text" class="flatpickr-input" readonly value="">
    <button type="button" aria-controls="day">Open calendar</button>
    <label for="code">Area code</label>
    <input id="code" name="code" type="text" pattern="[0-9]{3}" value="212" disabled>
    <button type="submit">Book</button>
  </form>
</main>
</body>
</html>
