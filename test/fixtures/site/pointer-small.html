<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Small targets</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main { padding: 24px; }
  a { color: #0b4a8f; }
  button, input, select { font: inherit; }
  /* Targets of 48px and a solid 3px ring, so the page passes 2.5.5 and 2.4.13 unless it
     plants something else on purpose. */
  .big { display: inline-block; min-width: 48px; min-height: 48px; padding: 10px 16px; box-sizing: border-box; }
  :focus-visible { outline: 3px solid #0b4a8f; outline-offset: 2px; }
  #tiny { width: 30px; height: 30px; padding: 0; }
  #small-copy { font-size: 14px; }
  .big + .big { margin-left: 8px; }
</style>
</head>
<body>
<main>
  <h1>Small targets</h1>
  <p><button id="tiny" type="button" aria-label="Close">x</button></p>
  <p>Read the <a id="inline" href="clean.html">privacy policy</a> before you sign up.</p>
  <p><a id="small-copy" href="nav-b.html">More</a> <a class="big" href="nav-b.html">More</a></p>
  <p><input id="agree" type="checkbox"> <label for="agree">I agree</label></p>
</main>
</body>
</html>
