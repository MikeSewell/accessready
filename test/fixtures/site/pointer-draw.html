<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signature pad</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main { padding: 24px; }
  a { color: #0b4a8f; }
  button, input, select { font: inherit; }
  /* Targets of 48px and a solid 3px ring, so the page passes 2.5.5 and 2.4.13 unless it
     plants something else on purpose. */
  .big { display: inline-block; min-width: 48px; min-height: 48px; padding: 10px 16px; box-sizing: border-box; }
  :focus-visible { outline: 3px solid #0b4a8f; outline-offset: 2px; }
  #pad { border: 1px solid #555; display: block; max-width: 100%; }
</style>
</head>
<body>
<main>
  <h1>Signature pad</h1>
  <canvas id="pad" width="400" height="160" aria-label="Sign here"></canvas>
</main>
<script>
  const pad = document.getElementById('pad'), g = pad.getContext('2d');
  let down = false;
  pad.addEventListener('pointerdown', (e) => { down = true; g.moveTo(e.offsetX, e.offsetY); });
  pad.addEventListener('pointermove', (e) => { if (down) { g.lineTo(e.offsetX, e.offsetY); g.stroke(); } });
  pad.addEventListener('pointerup', () => { down = false; });
</script>
</body>
</html>
