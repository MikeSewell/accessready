<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bold text instead of a heading</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main, footer, header { padding: 24px; }
  a { color: #0b4a8f; }
  .big { font-size: 28px; font-weight: 700; margin: 32px 0 8px; }
</style>
</head>
<body>
<main>
  <h1>About us</h1>
  <p class="big">Our programs</p>
  <p>We hand out food boxes every Saturday morning at the church hall on Elm Street. Anyone who lives in the county can come, and you do not need to bring any papers.</p>
</main>
</body>
</html>
