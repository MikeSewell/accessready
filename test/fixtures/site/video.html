<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moving video</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main { padding: 24px; }
  a { color: #0b4a8f; }
  button { font: inherit; padding: 8px 12px; }
</style>
</head>
<body>
<main>
  <h1>Moving video</h1>
  <div><div><video id="no-pause" src="clip.webm" width="160" height="90" autoplay muted loop playsinline></video></div></div>
  <div><div><video id="with-pause" src="clip.webm" width="160" height="90" autoplay muted loop playsinline></video>
  <button type="button" onclick="document.getElementById(&quot;with-pause&quot;).pause()">Pause video</button></div></div>
</main>
</body>
</html>
