<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forms that take their time</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main, footer { padding: 24px; }
  a { color: #0b4a8f; }
  label { display: block; margin-top: 12px; }
  input, button, textarea, select { font: inherit; padding: 8px 12px; margin: 4px 0; border: 1px solid #555; }
  .error { color: #a00; }
</style>
</head>
<body>
<main>
  <h1>Volunteer sign-up</h1>
  <p>Leave your name and we will call you back.</p>
  <form id="slow" action="/submit" method="post" novalidate aria-label="Slow check">
    <label for="name">Name (required)</label>
    <input id="name" name="name" type="text" autocomplete="name" required aria-describedby="name-error">
    <span id="name-error" class="error" role="alert"></span>
    <button type="submit">Send</button>
  </form>
  <form action="/submit" method="post" novalidate aria-label="Locked">
    <label for="code">Invitation code (required)</label>
    <input id="code" name="code" type="text" required>
    <button id="locked" type="submit" disabled>Join</button>
  </form>
</main>
<script>  // The message arrives a second after the button is pressed, as when a check waits on a timer.
  document.getElementById('slow').addEventListener('submit', (e) => {
    const name = document.getElementById('name');
    if (name.value) return;
    e.preventDefault();
    setTimeout(() => { name.setAttribute('aria-invalid', 'true'); document.getElementById('name-error').textContent = 'Enter your name'; }, 900);
  });
  // The second form cannot be sent until a code is typed: there is no error to show.
  document.getElementById('code').addEventListener('input', (e) => { document.getElementById('locked').disabled = !e.target.value; });</script>
</body>
</html>
