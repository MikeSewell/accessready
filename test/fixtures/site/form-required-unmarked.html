<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Required field not marked</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main, footer { padding: 24px; }
  a { color: #0b4a8f; }
  label { display: block; margin-top: 12px; }
  input, button, textarea, select { font: inherit; padding: 8px 12px; margin: 4px 0; border: 1px solid #555; }
  .error { color: #a00; }
</style>
</head>
<body>
<main>
  <h1>Call me back</h1>
  <p>Leave a number and we will call you within a day.</p>
  <form action="/submit" method="post">
    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="tel" autocomplete="tel" required>
    <label for="when">Best time to call</label>
    <input id="when" name="when" type="text">
    <button type="submit">Send</button>
  </form>
</main>
</body>
</html>
