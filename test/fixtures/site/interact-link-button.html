<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A link that calls itself a button</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main { padding: 24px; }
  a { color: #0b4a8f; }
  #wide-box { width: 700px; background: #e3ecf7; padding: 12px; }
</style>
</head>
<body>
<main>
  <h1>A link that calls itself a button</h1>
  <!-- A menu trigger built from a link: pressing Enter on it follows the link. The audit
       must stay on this page, so the reflow problem below is still found. -->
  <p><a id="products" href="left.html?from=disclosure" role="button" aria-expanded="false">Products</a></p>
  <div id="wide-box">A fixed-width box</div>
</main>
</body>
</html>
