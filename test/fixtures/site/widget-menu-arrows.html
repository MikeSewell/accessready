<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu bar without arrow keys</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main { padding: 24px; }
  a { color: #0b4a8f; }
  button, input, select { font: inherit; }
  /* Targets of 48px and a solid 3px ring, so the page passes 2.5.5 and 2.4.13 unless it
     plants something else on purpose. */
  .big { display: inline-block; min-width: 48px; min-height: 48px; padding: 10px 16px; box-sizing: border-box; }
  :focus-visible { outline: 3px solid #0b4a8f; outline-offset: 2px; }

  [role=menubar] { display: flex; gap: 8px; list-style: none; padding: 0; }
  [role=menuitem] { min-height: 48px; padding: 10px 16px; }
</style>
</head>
<body>
<main>
  <h1>Menu bar without arrow keys</h1>
  <!-- A menu bar with a roving tabindex, as the ARIA pattern says, but no arrow key handling,
       so only the first item can be reached from the keyboard. -->
  <ul role="menubar" aria-label="Tools">
    <li role="none"><button role="menuitem" type="button" tabindex="0">File</button></li>
    <li role="none"><button role="menuitem" type="button" tabindex="-1">Edit</button></li>
    <li role="none"><button role="menuitem" type="button" tabindex="-1">View</button></li>
  </ul>
</main>
</body>
</html>
