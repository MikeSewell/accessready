<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound that starts by itself</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main { padding: 24px; }
  a { color: #0b4a8f; }
  button { font: inherit; padding: 8px 12px; }
  section { margin-bottom: 24px; }
  video, audio { max-width: 100%; height: auto; }
  :focus-visible { outline: 3px solid #0b4a8f; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Sound that starts by itself</h1>
  <section>
    <h2>Welcome</h2>
    <p>A welcome message plays when the page opens. <a href="clean.html">Read the transcript</a>.</p>
    <audio id="welcome" src="sound.webm"></audio>
  </section>
</main>
<script>
  // Started by a script, not the autoplay attribute, so a rules engine cannot see it.
  document.getElementById("welcome").play().catch(() => {});
</script>
</body>
</html>
