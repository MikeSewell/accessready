<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video with a transcript only</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main { padding: 24px; }
  a { color: #0b4a8f; }
  button { font: inherit; padding: 8px 12px; }
  section { margin-bottom: 24px; }
  video, audio { max-width: 100%; height: auto; }
  :focus-visible { outline: 3px solid #0b4a8f; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Video with a transcript only</h1>
  <section>
    <h2>Our year</h2>
    <video id="year" src="sound.webm" width="320" height="180" controls preload="auto">
      <track kind="captions" src="captions.vtt" srclang="en" label="English">
    </video>
    <p><a href="clean.html">Read the transcript</a></p>
  </section>
</main>

</body>
</html>
