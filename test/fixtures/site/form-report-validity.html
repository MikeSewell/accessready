<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plain button that asks for the browser's own messages</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main, footer, header { padding: 24px; }
  a { color: #0b4a8f; }
  label { display: block; margin-top: 12px; }
  input, button, textarea, select { font: inherit; padding: 8px 12px; margin: 4px 0; border: 1px solid #555; }
  fieldset label { display: inline-block; margin-right: 16px; }
  .error { color: #a00; }
</style>
</head>
<body>
<main>
  <h1>Volunteer sign-up</h1>
  <p>Leave your name and we will call you back.</p>
  <form id="f" action="/submit" method="post">
    <label for="name">Name (required)</label>
    <input id="name" name="name" type="text" autocomplete="name" required>
    <button type="button" id="send">Send</button>
  </form>
</main>
<script>  // A plain button, not a submit button: it asks the browser to show its own message for
  // the empty field, which also moves focus there, and sends only when the form is complete.
  document.getElementById('send').addEventListener('click', () => {
    const form = document.getElementById('f');
    if (form.reportValidity()) form.submit();
  });</script>
</body>
</html>
