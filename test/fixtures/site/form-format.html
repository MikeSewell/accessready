<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formats nobody explains</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main, footer { padding: 24px; }
  a { color: #0b4a8f; }
  label { display: block; margin-top: 12px; }
  input, button, textarea, select { font: inherit; padding: 8px 12px; margin: 4px 0; border: 1px solid #555; }
  .error { color: #a00; }
</style>
</head>
<body>
<main>
  <h1>Book a delivery</h1>
  <p>We deliver food boxes to people who cannot travel.</p>
  <form action="/submit-get">
    <label for="zip">ZIP code</label>
    <input id="zip" name="zip" type="text" autocomplete="postal-code" pattern="[0-9]{5}">
    <label for="day">Date of the delivery</label>
    <input id="day" name="day" type="text">
    <button type="submit">Book</button>
  </form>
</main>
</body>
</html>
