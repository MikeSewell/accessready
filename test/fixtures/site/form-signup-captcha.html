<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign-up with a CAPTCHA</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main, footer, header { padding: 24px; }
  a { color: #0b4a8f; }
  label { display: block; margin-top: 12px; }
  input, button, textarea, select { font: inherit; padding: 8px 12px; margin: 4px 0; border: 1px solid #555; }
  fieldset label { display: inline-block; margin-right: 16px; }
  .error { color: #a00; }
</style>
</head>
<body>
<main>
  <h1>Create your account</h1>
  <p>Volunteers make an account to choose their shifts.</p>
  <form action="/submit" method="post">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text">
    <label for="email">Email</label>
    <input id="email" name="email" type="email">
    <label for="pw">Password</label>
    <input id="pw" name="pw" type="password">
    <div class="g-recaptcha" data-sitekey="demo" style="width: 260px; height: 78px; border: 1px solid #555; margin: 12px 0;"><p>CAPTCHA puzzle stands in here</p></div>
    <button type="submit">Create account</button>
  </form>
</main>
</body>
</html>
