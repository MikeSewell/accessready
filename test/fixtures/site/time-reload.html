<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reloads by itself</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main { padding: 24px; }
  a { color: #0b4a8f; }
  button { font: inherit; padding: 8px 12px; }

</style>
</head>
<body>
<main>
  <h1>Reloads by itself</h1>
  <p>This page reloads every five minutes to show the latest numbers.</p>
</main>
<script>
  setTimeout(() => { location.reload(); }, 5 * 60 * 1000);
</script>
</body>
</html>
