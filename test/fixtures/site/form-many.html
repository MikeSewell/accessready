<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search forms and four others</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main, footer, header { padding: 24px; }
  a { color: #0b4a8f; }
  label { display: block; margin-top: 12px; }
  input, button, textarea, select { font: inherit; padding: 8px 12px; margin: 4px 0; border: 1px solid #555; }
  fieldset label { display: inline-block; margin-right: 16px; }
  .error { color: #a00; }
</style>
</head>
<body>
<header>
  <form role="search" action="/submit-get" aria-label="Site">
    <label for="q1">Search the site</label>
    <input id="q1" name="q" type="search">
    <button type="submit">Search</button>
  </form>
  <form action="/submit-get" aria-label="Programs">
    <label for="q2">Find a program</label>
    <input id="q2" name="q" type="text">
    <button type="submit">Find</button>
  </form>
</header>
<main>
  <h1>Contact us</h1>
  <form action="/submit-get" aria-label="Newsletter">
    <label for="news">Email for the newsletter</label>
    <input id="news" name="news" type="email" autocomplete="email">
    <button type="submit">Subscribe</button>
  </form>
  <form id="contact" action="/submit" method="post" novalidate aria-label="Contact">
    <label for="name">Name (required)</label>
    <input id="name" name="name" type="text" autocomplete="name" required>
    <button type="submit">Send</button>
  </form>
  <form action="/submit-get" aria-label="Feedback">
    <label for="comment">Comment on this page</label>
    <textarea id="comment" name="comment"></textarea>
    <button type="submit">Send comment</button>
  </form>
  <form action="/submit-get" aria-label="Callback">
    <label for="when">Best time to call</label>
    <input id="when" name="when" type="text">
    <button type="submit">Ask for a call</button>
  </form>
</main>
<script>  // The contact form refuses to send while the name is empty, and says nothing about it.
  document.getElementById('contact').addEventListener('submit', (e) => { if (!document.getElementById('name').value) e.preventDefault(); });</script>
</body>
</html>
