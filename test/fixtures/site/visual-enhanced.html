<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enhanced contrast</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main { padding: 24px; }
  a { color: #0b4a8f; }
  button, input { font: inherit; padding: 8px 12px; }
  img { max-width: 100%; height: auto; }
  .on-grey { width: 360px; max-width: 100%; box-sizing: border-box; padding: 12px; background-image: url(mid.png); color: #fff; }
</style>
</head>
<body>
<main>
  <h1>Enhanced contrast</h1>
  <p id="on-grey" class="on-grey">White text on a mid grey photo reaches about 5.3:1.</p>
</main>

</body>
</html>
