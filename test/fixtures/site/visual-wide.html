<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wide table</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main { padding: 24px; }
  a { color: #0b4a8f; }
  button, input { font: inherit; padding: 8px 12px; }
  img { max-width: 100%; height: auto; }
  .wide { width: 900px; border-collapse: collapse; }
  .wide td { border: 1px solid #767676; padding: 4px 8px; }
</style>
</head>
<body>
<main>
  <h1>Wide table</h1>
  <table class="wide"><caption>Pantry hours</caption><tr><th scope="col">Day</th><th scope="col">Opens</th><th scope="col">Closes</th><th scope="col">Notes</th></tr><tr><td>Monday</td><td>9:00</td><td>17:00</td><td>Fresh produce delivered in the morning</td></tr></table>
</main>

</body>
</html>
