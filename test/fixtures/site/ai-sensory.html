<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply for a grant</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main, header { padding: 24px; }
  a { color: #0b4a8f; }
  button { font: inherit; padding: 8px 12px; }
  nav a { margin-right: 16px; }
</style>
</head>
<body>
<!-- AI review: an instruction that relies on shape, color and position. -->
<main>
  <h1>Apply for a grant</h1>
  <p>Fill in the form below. When you are done, press the round green button on the right.</p>
  <form action="clean.html">
    <label for="org">Organization name</label> <input id="org" type="text" autocomplete="organization">
    <button type="submit" aria-label="Send application" style="border-radius: 50%; background: #0a6b2d; color: #fff">&#8594;</button>
  </form>
</main>
</body>
</html>
