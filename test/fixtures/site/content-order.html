<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shown in a different order</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main, footer, header { padding: 24px; }
  a { color: #0b4a8f; }
  .steps { display: flex; flex-direction: row-reverse; gap: 24px; }
  .steps > div { flex: 1; }
</style>
</head>
<body>
<main>
  <h1>How it works</h1>
  <div class="steps">
    <div><p>First, call us to book a time for your visit.</p></div>
    <div><p>Then come to the hall and collect your food box.</p></div>
  </div>
</main>
</body>
</html>
