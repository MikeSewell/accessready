<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popup during the walk</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main { padding: 24px; }
  a { color: #0b4a8f; }
  #popup { position: fixed; inset: 0; background: #1c2733; color: #fff; padding: 24px; }
  #popup[hidden] { display: none; }
  button { font: inherit; padding: 8px 12px; }
</style>
</head>
<body>
<main>
  <h1>Popup during the walk</h1>
  <p><a id="first" href="clean.html">First link</a></p>
  <p><a id="second" href="clean.html">Second link, which opens the popup</a></p>
  <p><a id="third" href="clean.html">Third link, behind the popup</a></p>
</main>
<div id="popup" role="dialog" aria-modal="true" aria-labelledby="popup-title" hidden>
  <h2 id="popup-title">Join our newsletter</h2>
  <button id="popup-close" type="button">Close</button>
</div>
<script>
  // Stands in for a timed newsletter popup: it opens once, takes focus and keeps it. It opens
  // on the visitor's second press of Tab, as focus moves to the second link, so the walk meets
  // it at the same place every run. It is not tied to any element taking focus, so it is not
  // an on-focus change (3.2.1), and no letter key sets it off (2.1.4).
  const popup = document.getElementById('popup'), close = document.getElementById('popup-close');
  let presses = 0;
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab' || ++presses !== 2 || popup.dataset.shown) return;
    popup.dataset.shown = '1';
    setTimeout(() => { popup.hidden = false; close.focus(); }, 50);
  });
  close.addEventListener('keydown', (e) => { if (e.key === 'Tab') e.preventDefault(); });
</script>
</body>
</html>
