<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acts on press</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main { padding: 24px; }
  a { color: #0b4a8f; }
  button, input, select { font: inherit; }
  /* Targets of 48px and a solid 3px ring, so the page passes 2.5.5 and 2.4.13 unless it
     plants something else on purpose. */
  .big { display: inline-block; min-width: 48px; min-height: 48px; padding: 10px 16px; box-sizing: border-box; }
  :focus-visible { outline: 3px solid #0b4a8f; outline-offset: 2px; }

</style>
</head>
<body>
<main>
  <h1>Acts on press</h1>
  <p><button id="remove" class="big" type="button">Remove item</button></p>
  <p id="status"></p>
</main>
<script>
  // Removes on mousedown, so sliding off before letting go does not cancel it. A click from
  // the keyboard does the same, so it is not a keyboard problem.
  const remove = () => { document.getElementById('status').textContent = 'Item removed'; };
  document.getElementById('remove').addEventListener('mousedown', remove);
  document.getElementById('remove').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') remove(); });
</script>
</body>
</html>
