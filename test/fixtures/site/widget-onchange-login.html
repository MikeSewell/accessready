<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login form left alone</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main { padding: 24px; }
  a { color: #0b4a8f; }
  button, input, select { font: inherit; }
  /* Targets of 48px and a solid 3px ring, so the page passes 2.5.5 and 2.4.13 unless it
     plants something else on purpose. */
  .big { display: inline-block; min-width: 48px; min-height: 48px; padding: 10px 16px; box-sizing: border-box; }
  :focus-visible { outline: 3px solid #0b4a8f; outline-offset: 2px; }

</style>
</head>
<body>
<main>
  <h1>Login form left alone</h1>
  <form id="login" method="post" action="/login">
    <p><label for="user">Email</label> <input id="user" class="big" name="user" type="email" autocomplete="username"></p>
    <p><label for="pass">Password</label> <input id="pass" class="big" name="pass" type="password" autocomplete="current-password"></p>
    <p><input id="remember" name="remember" type="checkbox"> <label for="remember">Remember me</label></p>
    <p><button class="big" type="submit">Sign in</button></p>
  </form>
</main>
<script>
  // Submits as soon as the box is ticked. accessready must never touch a login form, so
  // this must not be operated and the server must never hear from it.
  document.getElementById('remember').addEventListener('change', () => document.getElementById('login').submit());
</script>
</body>
</html>
