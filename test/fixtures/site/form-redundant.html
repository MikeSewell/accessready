<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Address asked twice</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main, footer { padding: 24px; }
  a { color: #0b4a8f; }
  label { display: block; margin-top: 12px; }
  input, button, textarea, select { font: inherit; padding: 8px 12px; margin: 4px 0; border: 1px solid #555; }
  .error { color: #a00; }
</style>
</head>
<body>
<main>
  <h1>Order a gift box</h1>
  <p>We ship gift boxes to anyone in the state.</p>
  <form action="/submit-get">
    <p>We ship within three working days.</p>
    <fieldset>
      <legend>Billing address</legend>
      <label for="b-street">Street</label>
      <input id="b-street" name="b-street" type="text" autocomplete="billing street-address">
      <label for="b-zip">ZIP code</label>
      <input id="b-zip" name="b-zip" type="text" autocomplete="billing postal-code">
    </fieldset>
    <fieldset>
      <legend>Shipping address</legend>
      <label for="s-street">Street</label>
      <input id="s-street" name="s-street" type="text" autocomplete="shipping street-address">
      <label for="s-zip">ZIP code</label>
      <input id="s-zip" name="s-zip" type="text" autocomplete="shipping postal-code">
    </fieldset>
    <button type="submit">Continue to review</button>
  </form>
</main>
</body>
</html>
