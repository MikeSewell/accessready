<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table with a styled header row</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main, footer, header { padding: 24px; }
  a { color: #0b4a8f; }
  td { padding: 4px 16px 4px 0; }
</style>
</head>
<body>
<main>
  <h1>Opening hours</h1>
  <table>
    <tr><td><b>Day</b></td><td><b>Opens</b></td><td><b>Closes</b></td></tr>
    <tr><td>Monday</td><td>9am</td><td>5pm</td></tr>
    <tr><td>Saturday</td><td>10am</td><td>2pm</td></tr>
  </table>
</main>
</body>
</html>
