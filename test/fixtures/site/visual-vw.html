<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text sized to the window</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main { padding: 24px; }
  a { color: #0b4a8f; }
  button, input { font: inherit; padding: 8px 12px; }
  img { max-width: 100%; height: auto; }
  #hero { font-size: 4vw; }
</style>
</head>
<body>
<main>
  <h1 id="hero">Text sized to the window</h1>
  <p>The heading above is sized in vw units, so zooming does not make it bigger.</p>
</main>

</body>
</html>
