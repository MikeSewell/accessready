<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Error text not tied to its field</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main, footer { padding: 24px; }
  a { color: #0b4a8f; }
  label { display: block; margin-top: 12px; }
  input, button, textarea, select { font: inherit; padding: 8px 12px; margin: 4px 0; border: 1px solid #555; }
  .error { color: #a00; }
</style>
</head>
<body>
<main>
  <h1>Newsletter</h1>
  <p>One email a month about our work.</p>
  <form id="f" action="/submit" method="post" novalidate>
    <div class="row">
      <label for="email">Email (required)</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
    </div>
    <button type="submit">Subscribe</button>
  </form>
</main>
<script>  // Shows a helpful message next to the field and moves focus there, but the message is not
  // connected to the field, so a screen reader does not read it.
  document.getElementById('f').addEventListener('submit', (e) => {
    const email = document.getElementById('email');
    if (email.value.includes('@')) return;
    e.preventDefault();
    if (!document.querySelector('.error')) {
      const p = document.createElement('p');
      p.className = 'error';
      p.textContent = 'Enter an email address like name@example.com';
      email.after(p);
    }
    email.focus();
  });</script>
</body>
</html>
