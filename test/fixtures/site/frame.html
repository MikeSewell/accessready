<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embedded frame</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main { padding: 24px; }
  a { color: #0b4a8f; }
  iframe { max-width: 100%; border: 1px solid #555; }
</style>
</head>
<body>
<main>
  <h1>Embedded frame</h1>
  <p><a id="before-frame" href="clean.html">Link before the frame</a></p>
  <iframe src="inner.html" title="An embedded page" width="600" height="300"></iframe>
  <p><a id="after-frame" href="clean.html">Link after the frame</a></p>
</main>
</body>
</html>
