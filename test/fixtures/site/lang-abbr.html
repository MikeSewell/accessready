  <h1>Disaster help</h1>
  <p>After a flood, the CDC and FEMA publish advice for families who have lost their homes.</p>
  <p>The Department of Housing and Urban Development (HUD) can help with rent for a few months.</p>
  <p>Ask the <abbr title="Red Cross">ARC</abbr> desk at the shelter for a list of places to stay.</p>
