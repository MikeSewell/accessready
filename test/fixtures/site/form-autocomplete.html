<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal details without autocomplete</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main, footer { padding: 24px; }
  a { color: #0b4a8f; }
  label { display: block; margin-top: 12px; }
  input, button, textarea, select { font: inherit; padding: 8px 12px; margin: 4px 0; border: 1px solid #555; }
  .error { color: #a00; }
</style>
</head>
<body>
<main>
  <h1>Join the mailing list</h1>
  <p>We send one email a month.</p>
  <form action="/submit-get">
    <label for="full">Full name</label>
    <input id="full" name="full" type="text">
    <label for="mail">Email</label>
    <input id="mail" name="mail" type="email">
    <button type="submit">Join</button>
  </form>
</main>
</body>
</html>
