<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Small flashing</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main { padding: 24px; }
  a { color: #0b4a8f; }
  button { font: inherit; padding: 8px 12px; }

</style>
</head>
<body>
<main>
  <h1>Small flashing</h1>
  <p><span id="dot" style="display: inline-block; width: 40px; height: 40px; background: #000;"></span> New messages</p>
</main>
<script>
  // A small square flashing five times a second: under the 2.3.1 area limit, not under 2.3.2.
  const dot = document.getElementById("dot");
  let on = false;
  setInterval(() => { on = !on; dot.style.background = on ? "#fff" : "#000"; }, 100);
</script>
</body>
</html>
