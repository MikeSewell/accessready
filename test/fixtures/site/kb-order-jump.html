<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus jumps down the page</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  main { padding: 24px; }
  a { color: #0b4a8f; }
  button, input, select { font: inherit; }
  /* Targets of 48px and a solid 3px ring, so the page passes 2.5.5 and 2.4.13 unless it
     plants something else on purpose. */
  .big { display: inline-block; min-width: 48px; min-height: 48px; padding: 10px 16px; box-sizing: border-box; }
  :focus-visible { outline: 3px solid #0b4a8f; outline-offset: 2px; }
  main { position: relative; }
  #far { position: absolute; top: 2200px; left: 24px; }
  .spacer { height: 2400px; }
</style>
</head>
<body>
<main>
  <h1>Focus jumps down the page</h1>
  <p><a id="first" class="big" href="clean.html">First link</a>
  <a id="far" class="big" href="clean.html">Link drawn far below</a>
  <a id="second" class="big" href="clean.html">Second link</a></p>
  <div class="spacer"></div>
</main>
</body>
</html>
