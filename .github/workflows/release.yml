# Publishes to npm when a GitHub release is published. Uses npm trusted publishing:
# the package's settings on npmjs.com name this repo and this workflow, so no token is stored.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5 or newer.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      # The first version was published by hand, before trusted publishing could be set up.
      - name: Skip if this version is already on npm
        id: published
        run: |
          if npm view "$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.already != 'true'
        run: npm publish --access public
