# Runs the GitHub Action in this repository (action.yml) against the demo pages, so a change
# that breaks the action fails here before anyone's workflow depends on it.
name: Action test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Serve the demo pages
        run: |
          node test/serve.mjs > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/clean.html > /dev/null && exit 0; sleep 1; done
          cat serve.log; exit 1

      # A page with a planted problem: the action has to fail, report it and comment.
      - name: Audit a failing page
        id: failing
        uses: ./
        continue-on-error: true
        with:
          url: http://127.0.0.1:4173
          paths: |
            /clean.html
            /focus.html
          args: --viewports desktop
          artifact-name: accessready-failing

      - name: The failing audit exited 1 and wrote every report
        env:
          CODE: ${{ steps.failing.outputs.exit-code }}
          JSON: ${{ steps.failing.outputs.json }}
          SARIF: ${{ steps.failing.outputs.sarif }}
          HTML: ${{ steps.failing.outputs.html }}
          OUTCOME: ${{ steps.failing.outcome }}
        run: |
          test "$CODE" = 1 || { echo "exit code was $CODE, expected 1"; exit 1; }
          test "$OUTCOME" = failure || { echo "the step should have failed, outcome was $OUTCOME"; exit 1; }
          test -s "$HTML"
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.env.JSON, "utf8"));
            if (r.pages.length !== 2 || r.totals.failures < 1) throw new Error("unexpected totals " + JSON.stringify(r.totals));
            const s = JSON.parse(require("fs").readFileSync(process.env.SARIF, "utf8"));
            if (s.version !== "2.1.0" || !s.runs[0].results.some((x) => x.ruleId === "focus-visible")) throw new Error("SARIF is missing the focus-visible result");
          '

      # The same action on a clean page has to pass.
      - name: Audit a clean page
        id: clean
        uses: ./
        with:
          url: http://127.0.0.1:4173/clean.html
          args: --viewports desktop
          comment: 'false'
          artifact-name: accessready-clean

      - name: The clean audit exited 0
        env:
          CODE: ${{ steps.clean.outputs.exit-code }}
        run: test "$CODE" = 0
